# Free: runs daily on GitHub Actions, commits fresh news.json, and GitHub Pages serves ./docs.
name: daily-digest
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
